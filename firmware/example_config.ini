; config.ini — drive unit, 2 declared axes
; Save this file as Marlin/config.ini — the Marlin SUBFOLDER, beside Configuration.h,
; NOT the project root. platformio.ini declares it under extra_configs as Marlin/config.ini.
; buildroot/share/PlatformIO/scripts/configuration.py applies it before compiling.
; It edits Configuration.h and Configuration_adv.h in place, and never reverts.
;
; REPLACE the config.ini that ships in Marlin/ — do not paste this into it. The shipped
; file carries ini_use_config = none, which means ignore this file entirely. Leave that
; line in place and nothing below applies, with a clean build and no warning.
;
; FIRST BUILD ON A FRESH TREE: name the environment explicitly, because Auto Build Marlin
; reads MOTHERBOARD from Configuration.h to decide what to offer, and nothing has applied
; this file yet. platformio run --environment <env>. After that one build it auto-detects.

[config:base]
; Uncomment the next line once the machine is tuned and the headers are where they should
; be. It freezes them: this file stops re-applying on every build, so hand edits to
; Configuration.h survive. Leave it commented while the calculator is still the source
; of truth, or the settings below will silently stop taking effect.
; ini_use_config            = none
motherboard                 = BOARD_BTT_OCTOPUS_V1_1
serial_port                 = -1
baudrate                    = 250000
eeprom_settings             = on
extruders                   = 0
temp_sensor_0               = 0
temp_sensor_bed             = 0
x_driver_type               = TMC2209
y_driver_type               = TMC2209
z_driver_type               = off
i_driver_type               = off
j_driver_type               = off
k_driver_type               = off
u_driver_type               = off
v_driver_type               = off
w_driver_type               = off
z2_driver_type              = off
e0_driver_type              = off
default_axis_steps_per_unit = { 320, 240 }
default_max_feedrate        = { 310, 270 }
default_max_acceleration    = { 3000, 3000 }
default_acceleration        = 500
default_travel_acceleration = 500
use_xmin_plug               = on
use_ymin_plug               = on
endstoppullups              = on
x_min_endstop_inverting     = true
y_min_endstop_inverting     = true
x_home_dir                  = -1
y_home_dir                  = -1
invert_x_dir                = false
invert_y_dir                = false
x_bed_size                  = 395
x_min_pos                   = 0
y_bed_size                  = 300
y_min_pos                   = 0
min_software_endstops       = on
max_software_endstops       = on
no_motion_before_homing     = off
home_after_deactivate       = off
homing_feedrate_mm_m        = { (15*60), (15*60) }
x_current                   = 1400
x_current_home              = 1000
x_microsteps                = 16
x_rsense                    = 0.11
x_chain_pos                 = -1
y_current                   = 1050
y_current_home              = 750
y_microsteps                = 16
y_rsense                    = 0.11
y_chain_pos                 = -1
monitor_driver_status       = on
endstops_always_on_default  = on
homing_bump_mm              = { 5, 5 }
homing_bump_divisor         = { 4, 4 }
homing_backoff_post_mm      = { 2, 2 }
axis_relative_modes         = { false, false }
